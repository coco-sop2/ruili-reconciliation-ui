openapi: 3.0.3
info:
  title: 锐力对账 API
  version: 1.0.0
  description: 前端只负责文件提交和结果展示；所有解析、匹配、计算及状态判定均由后端完成。
servers:
  - url: http://localhost:8080
    description: 本地联调
tags:
  - name: Reconciliation

paths:
  /api/v1/reconciliation-tasks:
    post:
      tags: [Reconciliation]
      summary: 创建对账任务
      operationId: createReconciliationTask
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 前端为每次用户提交生成的 UUID，用于避免重复创建任务。
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [settlementFile, erpFile]
              properties:
                settlementFile:
                  type: string
                  format: binary
                  description: 渠道、平台或门店结算单，支持 xlsx/xls，最大 20 MB。
                erpFile:
                  type: string
                  format: binary
                  description: ERP 销售或收款明细，支持 xlsx/xls，最大 20 MB。
      responses:
        '202':
          description: 任务已创建并进入队列。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedFileType'
        '422':
          $ref: '#/components/responses/InvalidFileStructure'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Reconciliation]
      summary: 获取对账任务列表
      operationId: listReconciliationTasks
      parameters:
        - name: status
          in: query
          description: 逗号分隔的状态，可同时查询 QUEUED 和 PROCESSING。
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ReconciliationStatus'
        - name: keyword
          in: query
          description: 匹配任务 ID、文件名或创建人姓名。
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 按创建时间倒序返回任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/reconciliation-tasks/{taskId}:
    get:
      tags: [Reconciliation]
      summary: 获取单个任务最新状态与详情
      operationId: getReconciliationTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 任务详情。前端通过此接口轮询非终态任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailEnvelope'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/reconciliation-statistics:
    get:
      tags: [Reconciliation]
      summary: 获取对账总览统计
      operationId: getReconciliationStatistics
      parameters:
        - name: month
          in: query
          description: 统计月份；不传时由后端按当前业务时区确定。
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-08'
      responses:
        '200':
          description: 月度统计和近七周趋势。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    ReconciliationStatus:
      type: string
      enum: [QUEUED, PROCESSING, SUCCEEDED, NEEDS_REVIEW, FAILED]
    Money:
      type: object
      required: [currency, value]
      properties:
        currency:
          type: string
          enum: [CNY]
        value:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          example: '12680.00'
    UploadedFile:
      type: object
      required: [id, name, size, uploadedAt]
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: integer
          format: int64
          description: 文件字节数。
        uploadedAt:
          type: string
          format: date-time
    ReconciliationMetrics:
      type: object
      required: [settlementAmount, differenceAmount, totalCount, matchedCount, differenceCount]
      properties:
        settlementAmount:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Money' }]
        differenceAmount:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Money' }]
        totalCount:
          type: integer
          nullable: true
          minimum: 0
        matchedCount:
          type: integer
          nullable: true
          minimum: 0
        differenceCount:
          type: integer
          nullable: true
          minimum: 0
    UserSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    ReconciliationTask:
      type: object
      required:
        - id
        - status
        - periodLabel
        - settlementFile
        - erpFile
        - metrics
        - createdAt
        - completedAt
        - createdBy
      properties:
        id:
          type: string
          example: REC-260806-019
        status:
          $ref: '#/components/schemas/ReconciliationStatus'
        periodLabel:
          type: string
          nullable: true
          example: 2026年7月
        settlementFile:
          $ref: '#/components/schemas/UploadedFile'
        erpFile:
          $ref: '#/components/schemas/UploadedFile'
        metrics:
          $ref: '#/components/schemas/ReconciliationMetrics'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          $ref: '#/components/schemas/UserSummary'
    ReconciliationTaskDetail:
      allOf:
        - $ref: '#/components/schemas/ReconciliationTask'
        - type: object
          required: [failure]
          properties:
            failure:
              type: object
              nullable: true
              required: [code, message]
              properties:
                code: { type: string, example: INVALID_FILE_STRUCTURE }
                message: { type: string, example: ERP 表单缺少必需的订单编号列 }
    PaginatedTasks:
      type: object
      required: [items, page, pageSize, total, facets]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReconciliationTask' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        facets:
          type: object
          description: 在当前 keyword 条件下、应用 status 筛选前的状态计数，用于历史任务筛选标签。
          required: [total, byStatus]
          properties:
            total: { type: integer, minimum: 0 }
            byStatus:
              type: object
              required: [QUEUED, PROCESSING, SUCCEEDED, NEEDS_REVIEW, FAILED]
              properties:
                QUEUED: { type: integer, minimum: 0 }
                PROCESSING: { type: integer, minimum: 0 }
                SUCCEEDED: { type: integer, minimum: 0 }
                NEEDS_REVIEW: { type: integer, minimum: 0 }
                FAILED: { type: integer, minimum: 0 }
    ReconciliationStatistics:
      type: object
      required:
        - month
        - totalTasks
        - succeededTasks
        - needsReviewTasks
        - failedTasks
        - processingTasks
        - autoMatchRate
        - monthOverMonthRate
        - totalDifferenceAmount
        - trend
        - updatedAt
      properties:
        month: { type: string, example: '2026-08' }
        totalTasks: { type: integer, minimum: 0 }
        succeededTasks: { type: integer, minimum: 0 }
        needsReviewTasks: { type: integer, minimum: 0 }
        failedTasks: { type: integer, minimum: 0 }
        processingTasks: { type: integer, minimum: 0 }
        autoMatchRate: { type: number, minimum: 0, maximum: 1, example: 0.75 }
        monthOverMonthRate: { type: number, example: 0.125 }
        totalDifferenceAmount: { $ref: '#/components/schemas/Money' }
        trend:
          type: array
          items:
            type: object
            required: [label, taskCount]
            properties:
              label: { type: string, example: 第1周 }
              taskCount: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details:
              type: object
              additionalProperties: true
    TaskEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/ReconciliationTask' }
        requestId: { type: string }
    TaskDetailEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/ReconciliationTaskDetail' }
        requestId: { type: string }
    TaskListEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/PaginatedTasks' }
        requestId: { type: string }
    StatisticsEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data: { $ref: '#/components/schemas/ReconciliationStatistics' }
        requestId: { type: string }
  responses:
    BadRequest:
      description: 请求参数或必需文件缺失。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    FileTooLarge:
      description: 文件超过 20 MB。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedFileType:
      description: 文件不是支持的 Excel 类型。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidFileStructure:
      description: 文件内容无法解析或缺少必要字段。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TaskNotFound:
      description: 任务不存在或当前用户无权访问。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: 服务端内部错误。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
